<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="atividade_1.css">
  <script src="./atividade_1.js" defer></script>
  <title>Cadastro Usuario</title>
</head>

<body>
  <form>
    <div>
      <label for="nome">Nome *</label>
      <input id="nome" type="text" placeholder="Digite o nome do usuário" required>
    </div>
    <div>
      <label for="email">E-mail *</label>
      <input id="email" type="email" placeholder="Digite o e-mail do usuário" required>
    </div>
    <div>
      <label for="celular">Telefone Celular *</label>
      <input id="celular" type="text" placeholder="(99) 99999-9999" required>
    </div>

    <button id="btnCadastrar" type="submit" class="btn-base cadastrar" disabled>Cadastrar</button>

    <a href="../Aula_2/atividade_1.html">
      <button type="button" class="btn-base voltar">Voltar</button>
    </a>
  </form>
</body>

</html>
